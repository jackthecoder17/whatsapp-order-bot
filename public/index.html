<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Order Bot</title>
<style>
  :root {
    --wa-dark: #075e54; --wa-green: #25d366; --wa-bubble: #dcf8c6; --wa-bg: #ece5dd;
    --ink: #1f2328; --muted: #667085; --line: #e4e7ec; --card: #fff; --page: #f5f6f8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); }
  header.top { padding: 18px 24px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header.top h1 { font-size: 20px; margin: 0; }
  header.top span { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: 390px 1fr; gap: 24px; padding: 0 24px 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; } header.top { padding: 16px; } }

  /* Phone */
  .phone { background: #111; border-radius: 36px; padding: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
  .screen { border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; height: 720px; max-height: 80vh; background: var(--wa-bg); }
  .wa-head { background: var(--wa-dark); color: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: #f4a261; display: grid; place-items: center; font-size: 20px; }
  .wa-head b { display: block; font-size: 15px; }
  .wa-head small { opacity: .8; font-size: 12px; }
  .wa-head button { margin-left: auto; background: transparent; border: 1px solid rgba(255,255,255,.4); color: #fff; border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .chat { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px;
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1px); background-size: 14px 14px; }
  .msg { max-width: 82%; padding: 7px 10px 18px; border-radius: 8px; font-size: 14px; line-height: 1.38; white-space: pre-wrap; word-wrap: break-word; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
  .msg.bot, .msg.owner { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
  .msg.customer { background: var(--wa-bubble); align-self: flex-end; border-top-right-radius: 0; }
  .msg time { position: absolute; right: 8px; bottom: 3px; font-size: 10.5px; color: #8a9199; }
  .typing { align-self: flex-start; background: #fff; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); display: none; }
  .quick { display: flex; gap: 6px; padding: 6px 8px 0; overflow-x: auto; background: #f0f0f0; }
  .quick button { flex: none; border: 1px solid #cfd4da; background: #fff; border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  form.compose { display: flex; gap: 8px; padding: 8px; background: #f0f0f0; }
  form.compose input { flex: 1; border: none; border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none; }
  form.compose button { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--wa-dark); color: #fff; font-size: 18px; cursor: pointer; }

  .dash { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; height: 744px; max-height: calc(80vh + 24px); }
  .dash iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 900px) { .dash { height: 80vh; } }
</style>
</head>
<body>
<header class="top">
  <h1 id="bizName">WhatsApp Order Bot</h1>
  <span>Customer chat (left) · Owner dashboard (right) · <a href="/dashboard" target="_blank">open dashboard alone ↗</a></span>
</header>

<main>
  <section class="phone" aria-label="WhatsApp chat simulator">
    <div class="screen">
      <div class="wa-head">
        <div class="avatar">🍲</div>
        <div><b id="chatName">Business</b><small>online</small></div>
        <button id="resetBtn" type="button">New chat</button>
      </div>
      <div class="chat" id="chat"><div class="typing" id="typing">typing…</div></div>
      <div class="quick" id="quick"></div>
      <form class="compose" id="compose">
        <input id="input" autocomplete="off" placeholder="Type a message" aria-label="Message">
        <button aria-label="Send">➤</button>
      </form>
    </div>
  </section>

  <section class="dash" aria-label="Owner dashboard">
    <iframe src="/dashboard?embed=1" title="Owner dashboard"></iframe>
  </section>
</main>

<script>
const naira = n => '₦' + Number(n).toLocaleString('en-NG');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>'); // WhatsApp *bold*

let phone = localStorage.getItem('simPhone') || newPhone();
function newPhone() { const p = 'sim-' + Math.random().toString(36).slice(2, 8); try { localStorage.setItem('simPhone', p); } catch {} return p; }

const chat = document.getElementById('chat');
const typing = document.getElementById('typing');
let lastId = 0;

fetch('/api/me').then(r => r.json()).then(c => {
  document.getElementById('bizName').textContent = c.businessName;
  document.getElementById('chatName').textContent = c.businessName;
  document.title = c.businessName + ' — Order Bot';
});

function addMsg(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + m.from;
  const t = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  d.innerHTML = fmt(m.text) + `<time>${t}</time>`;
  chat.insertBefore(d, typing);
  chat.scrollTop = chat.scrollHeight;
}

// Only one poll runs at a time (overlapping polls showed messages twice);
// a poll requested meanwhile runs right after the current one finishes.
let polling = null, pollAgain = false;
async function poll() {
  if (polling) { pollAgain = true; return polling; }
  polling = (async () => {
    do {
      pollAgain = false;
      try {
        const msgs = await fetch(`/api/sim/messages?phone=${phone}&after=${lastId}`).then(r => r.json());
        for (const m of msgs) if (m.id > lastId) { addMsg(m); lastId = m.id; }
      } catch {}
    } while (pollAgain);
    polling = null;
  })();
  return polling;
}

async function sendText(text) {
  if (!text.trim()) return;
  typing.style.display = 'block';
  chat.scrollTop = chat.scrollHeight;
  await fetch('/api/sim/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone, text }) });
  await new Promise(r => setTimeout(r, 450)); // feels more natural
  typing.style.display = 'none';
  await poll();
}

document.getElementById('compose').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value; input.value = '';
  sendText(text);
});

['Hi', '1', '2', '3', '4', '5', 'C', 'menu'].forEach(q => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = q;
  b.onclick = () => sendText(q);
  document.getElementById('quick').appendChild(b);
});

document.getElementById('resetBtn').onclick = async () => {
  await fetch('/api/sim/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) });
  phone = newPhone(); lastId = 0;
  chat.querySelectorAll('.msg').forEach(m => m.remove());
};

poll();
setInterval(poll, 1500);
if (!localStorage.getItem('simStarted')) { try { localStorage.setItem('simStarted', '1'); } catch {} sendText('Hi'); }
</script>
</body>
</html>
